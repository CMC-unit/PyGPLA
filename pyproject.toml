[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pygpla"
dynamic = ["version"]
description = "Generalized Phase Locking Analysis (GPLA) toolkit in Python."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Amir Khani", email = "i.khani.amir@gmail.com"},
  {name = "Shervin Safavi"},
]
dependencies = [
  "numpy>=1.21",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
docs = [
  "sphinx>=7.0,<9.0",
  "myst-parser>=2.0,<5.0",
  "sphinx-rtd-theme",
  "linkify-it-py",
]
tests = [
  "pytest>=7.0",
  "numpy>=1.21",
]
sim = [
  "scipy>=1.9",
]
figures = [
  "matplotlib>=3.5",
]

[project.urls]
Repository = "https://github.com/CMC-unit/PyGPLA"
Documentation = "https://github.com/CMC-unit/PyGPLA#readme"

[tool.hatch.version]
path = "src/pygpla/_version.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = [
  "src/pygpla",
  "tests",
  "README.md",
  "LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pygpla"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The figure script intentionally imports pygpla after inserting src/ on sys.path.
"paper/figures/figure2.py" = ["E402"]
